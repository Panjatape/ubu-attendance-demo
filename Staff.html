<script>
  if (!window.storage) {
    const PREFIX_SHARED = "ubu_shared__";
    const PREFIX_PRIVATE = "ubu_private__";
    function keyFor(key, shared) { return (shared ? PREFIX_SHARED : PREFIX_PRIVATE) + key; }
    window.storage = {
      async get(key, shared = false) {
        const raw = localStorage.getItem(keyFor(key, shared));
        if (raw === null) return null;
        return { key, value: raw, shared };
      },
      async set(key, value, shared = false) {
        localStorage.setItem(keyFor(key, shared), value);
        return { key, value, shared };
      },
      async delete(key, shared = false) {
        const existed = localStorage.getItem(keyFor(key, shared)) !== null;
        localStorage.removeItem(keyFor(key, shared));
        return { key, deleted: existed, shared };
      },
      async list(prefix = "", shared = false) {
        const fullPrefix = keyFor(prefix, shared);
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(fullPrefix)) {
            keys.push(k.slice((shared ? PREFIX_SHARED : PREFIX_PRIVATE).length));
          }
        }
        return { keys, prefix, shared };
      }
    };
  }
</script>

<script>
const EVENT_TYPES = ["กิจกรรมวิชาการ","กิจกรรมนักศึกษา","อบรม/สัมมนา","กีฬา","ศิลปวัฒนธรรม","จิตอาสา","ประชาสัมพันธ์","อื่นๆ"];
const ACADEMIC_YEARS = ["2567","2568","2569"];
const SEMESTERS = ["ภาค 1","ภาค 2","ภาคพิเศษ"];
const FACULTIES = [
  "คณะวิทยาศาสตร์","คณะเกษตรศาสตร์","คณะวิศวกรรมศาสตร์","คณะศิลปศาสตร์","คณะเภสัชศาสตร์",
  "คณะบริหารศาสตร์","คณะพยาบาลศาสตร์","วิทยาลัยแพทยศาสตร์และการสาธารณสุข",
  "คณะศิลปประยุกต์และสถาปัตยกรรมศาสตร์","คณะนิติศาสตร์","คณะรัฐศาสตร์","คณะศึกษาศาสตร์"
];

let state = { currentUser:null, events:[], filterType:"", editingId:null, formImages:[], formTeam:[], formGeo:{lat:null,lng:null,radius:100} };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function loadEvents(){
  try{ const res=await window.storage.get("events-list",true); state.events=res?JSON.parse(res.value):[]; }
  catch(e){ state.events=[]; }
}
async function saveEvents(){
  try{ await window.storage.set("events-list",JSON.stringify(state.events),true); }
  catch(e){ console.error("Save failed",e); alert("บันทึกข้อมูลไม่สำเร็จ ลองอีกครั้ง"); }
}

function initials(name){ if(!name)return"?"; const p=name.trim().split(" "); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function fmtDate(d){ if(!d)return"-"; try{return new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});}catch(e){return d;} }
function escapeHtml(s){ if(s==null)return""; return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function truncate(s,n){ return s.length>n?s.slice(0,n)+"…":s; }

function render(){
  const grid=document.getElementById("eventGrid");
  const statStrip=document.getElementById("statStrip");
  const filtered=state.filterType?state.events.filter(e=>e.type===state.filterType):state.events;
  const sorted=[...filtered].sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  const totalEvents=state.events.length;
  const totalAttendees=state.events.reduce((s,e)=>s+(Number(e.kpiAttendActual)||0),0);
  const satScores=state.events.filter(e=>e.kpiSatActual).map(e=>Number(e.kpiSatActual));
  const avgSat=satScores.length?(satScores.reduce((a,b)=>a+b,0)/satScores.length).toFixed(1):"-";

  statStrip.innerHTML=`
    <div class="stat-box"><div class="num">${totalEvents}</div><div class="lbl">กิจกรรมทั้งหมด</div></div>
    <div class="stat-box"><div class="num">${totalAttendees.toLocaleString()}</div><div class="lbl">ผู้เข้าร่วมสะสม</div></div>
    <div class="stat-box"><div class="num">${avgSat}</div><div class="lbl">คะแนนความพึงพอใจเฉลี่ย</div></div>
  `;

  if(sorted.length===0){
    grid.innerHTML=`<div class="empty"><p>ยังไม่มีกิจกรรม</p><p style="font-size:13px; color:var(--ink-soft);">กดปุ่ม "เพิ่มกิจกรรม" เพื่อเริ่มบันทึก</p></div>`;
  }else{
    grid.innerHTML=sorted.map(renderEventCard).join("");
  }

  attachMainHandlers();
}

function renderEventCard(e){
  const cover=e.images&&e.images.length?e.images[0]:null;
  const attendHit=e.kpiAttendTarget&&e.kpiAttendActual&&Number(e.kpiAttendActual)>=Number(e.kpiAttendTarget);
  const satHit=e.kpiSatTarget&&e.kpiSatActual&&Number(e.kpiSatActual)>=Number(e.kpiSatTarget);
  return `
    <div class="event-card">
      <div class="thumb">${cover?`<img src="${cover}" alt="">`:`ไม่มีรูปภาพ`}</div>
      <div class="event-body">
        <span class="badge">${escapeHtml(e.type||"ไม่ระบุประเภท")}</span>
        <div class="event-title">${escapeHtml(e.title||"(ไม่มีชื่อ)")}</div>
        <div class="meta-row">
          <span>${fmtDate(e.date)}</span><span>·</span><span>Host: ${escapeHtml(e.host||"-")}</span>
          ${e.geoLat?`<span>·</span><span title="รัศมี ${e.geoRadius} ม.">📍 ${e.geoRadius}ม.</span>`:""}
        </div>
        ${(e.academicYear||e.semester||e.faculty)?`
        <div class="meta-row">
          ${e.academicYear?`<span>ปี ${escapeHtml(e.academicYear)}</span>`:""}
          ${e.semester?`<span>·</span><span>${escapeHtml(e.semester)}</span>`:""}
          ${e.faculty?`<span>·</span><span>${escapeHtml(e.faculty)}</span>`:""}
        </div>`:""}
        ${e.description?`<p style="font-size:12.5px; color:var(--ink-soft); margin:0;">${escapeHtml(truncate(e.description,90))}</p>`:""}
        ${(e.kpiAttendTarget||e.kpiSatTarget)?`
        <div class="kpi-row">
          ${e.kpiAttendTarget?`<div class="kpi-chip ${e.kpiAttendActual?(attendHit?'hit':'miss'):''}"><span class="val">${e.kpiAttendActual||"-"}/${e.kpiAttendTarget}</span>ผู้เข้าร่วม</div>`:""}
          ${e.kpiSatTarget?`<div class="kpi-chip ${e.kpiSatActual?(satHit?'hit':'miss'):''}"><span class="val">${e.kpiSatActual||"-"}/${e.kpiSatTarget}</span>ความพึงพอใจ</div>`:""}
        </div>`:""}
      </div>
      <div class="card-actions">
        <a class="btn-small" href="Scan_Organizer.html?event=${encodeURIComponent(e.id)}" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">📽️ ฉาย QR</a>
        <button class="btn-small edit-btn" data-id="${e.id}">แก้ไข</button>
        <button class="btn-small del-btn" data-id="${e.id}" style="color:var(--red); border-color:var(--red-100);">ลบ</button>
      </div>
    </div>
  `;
}

function attachMainHandlers(){
  document.getElementById("logout-link").addEventListener("click",()=>{
    localStorage.removeItem("ubu_session");
    window.location.href="index.html";
  });
  document.getElementById("filter-type").addEventListener("change",(e)=>{ state.filterType=e.target.value; render(); });
  document.getElementById("new-event-btn").addEventListener("click",()=>openForm(null));
  document.querySelectorAll(".edit-btn").forEach(b=>b.addEventListener("click",()=>openForm(b.dataset.id)));
  document.querySelectorAll(".del-btn").forEach(b=>b.addEventListener("click",async()=>{
    if(confirm("ยืนยันการลบกิจกรรมนี้?")){
      state.events=state.events.filter(ev=>ev.id!==b.dataset.id);
      await saveEvents(); render();
    }
  }));
}

async function openForm(id){
  state.editingId=id;
  const existing=id?state.events.find(e=>e.id===id):null;
  state.formImages=existing?[...existing.images||[]]:[];
  state.formTeam=existing?[...existing.team||[]]:[];
  let defaultRadius=100;
  state.formDefaults={requireCheckout:true,minAttendPercent:80};
  try{
    const res=await window.storage.get("system-config",true);
    if(res){
      const cfg=JSON.parse(res.value);
      if(cfg.defaultGeoRadius)defaultRadius=cfg.defaultGeoRadius;
      if(cfg.requireCheckout!==undefined)state.formDefaults.requireCheckout=cfg.requireCheckout;
      if(cfg.minAttendPercent!==undefined)state.formDefaults.minAttendPercent=cfg.minAttendPercent;
    }
  }catch(e){}
  if(existing&&existing.geoLat){ state.formGeo={lat:existing.geoLat,lng:existing.geoLng,radius:existing.geoRadius||100}; }
  else{ state.formGeo={lat:null,lng:null,radius:defaultRadius}; }
  document.getElementById("modal-root").innerHTML=renderForm(existing);
  attachFormHandlers(existing);
}

        <div class="section-label">ทีมงาน</div>
        <div class="team-list" id="team-list"></div>
        <div class="add-team-row">

        <div class="img-upload" id="img-upload-zone">คลิกเพื่อเลือกรูปภาพ หรือลากไฟล์มาวาง</div>
        <input type="file" id="img-input" accept="image/*" multiple style="display:none;">
        <div class="img-preview-grid" id="img-preview-grid"></div>

        <div class="divider"></div>
        <div class="section-label">Geo-fencing (จำกัดพื้นที่เช็คชื่อ)</div>
        <div class="geo-box">
          <div class="geo-locate-row">
            <button type="button" class="btn-primary" id="geo-locate-btn" style="width:auto;">📍 ใช้ตำแหน่งปัจจุบัน</button>
            <span class="geo-coords" id="geo-coords-text">${e.geoLat?"set":"ยังไม่ได้ปักหมุด"}</span>
          </div>
          <div class="geo-map-preview empty" id="geo-map-preview"><span id="geo-map-placeholder">แผนที่แสดงพื้นที่รัศมีจะปรากฏที่นี่หลังปักหมุด</span></div>
          <div class="geo-radius-row">
            <span class="mini-label">รัศมีที่อนุญาต:</span>
            <div class="radius-pill" data-radius="50">50 ม.</div>
            <div class="radius-pill" data-radius="100">100 ม.</div>
            <div class="radius-pill" data-radius="200">200 ม.</div>
          </div>
          <div class="geo-hint">ผู้เข้าร่วมต้องอยู่ภายในรัศมีที่กำหนดจากจุดนี้ขณะสแกน QR จึงจะเช็คชื่อผ่าน</div>
        </div>

        <div class="divider"></div>
        <div class="section-label">เกณฑ์ "เข้าร่วมสำเร็จ"</div>
        <div class="kpi-grid">
          <div class="kpi-box">
            <label>บังคับสแกนเข้า + สแกนออก</label>
            <div class="mini-row" style="align-items:center; gap:10px;">
              <div class="toggle ${(e.requireCheckout!==undefined?e.requireCheckout:state.formDefaults.requireCheckout)?'on':''}" id="f-require-checkout"><div class="knob"></div></div>
              <span class="mini-label" style="flex:1;">หากปิด จะนับว่าเข้าร่วมสำเร็จจากการสแกนเข้าเพียงครั้งเดียว</span>

        <div class="divider"></div>
        <div class="section-label">KPI วัดผล</div>
        <div class="kpi-grid">
          <div class="kpi-box">

            <div class="mini-row">
              <div style="flex:1;"><div class="mini-label">เป้าหมาย</div><input type="number" id="f-attend-target" min="0" value="${e.kpiAttendTarget||""}"></div>
              <div style="flex:1;"><div class="mini-label">ผลจริง</div><input type="number" id="f-attend-actual" min="0" value="${e.kpiAttendActual||""}"></div>
            </div>
          </div>
          <div class="kpi-box">
            <label>ความพึงพอใจ (เต็ม 5)</label>

              <div style="flex:1;"><div class="mini-label">เป้าหมาย</div><input type="number" id="f-sat-target" min="0" max="5" step="0.1" value="${e.kpiSatTarget||""}"></div>
              <div style="flex:1;"><div class="mini-label">ผลจริง</div><input type="number" id="f-sat-actual" min="0" max="5" step="0.1" value="${e.kpiSatActual||""}"></div>

          <button class="btn-primary" id="save-form-btn">บันทึกกิจกรรม</button>

      </div>

}

function renderTeamList(){
  const list=document.getElementById("team-list");
  if(!list)return;
  list.innerHTML=state.formTeam.map((name,i)=>`
    <div class="team-tag">${escapeHtml(name)}<button data-idx="${i}" class="rm-team-btn" type="button">✕</button></div>
  `).join("");
  list.querySelectorAll(".rm-team-btn").forEach(b=>b.addEventListener("click",()=>{ state.formTeam.splice(Number(b.dataset.idx),1); renderTeamList(); }));
}
function renderImgPreviews(){
  const grid=document.getElementById("img-preview-grid");
  if(!grid)return;
  grid.innerHTML=state.formImages.map((src,i)=>`
    <div class="img-preview"><img src="${src}" alt=""><button class="rm rm-img-btn" data-idx="${i}" type="button">✕</button></div>
  `).join("");
  grid.querySelectorAll(".rm-img-btn").forEach(b=>b.addEventListener("click",()=>{ state.formImages.splice(Number(b.dataset.idx),1); renderImgPreviews(); }));
}
function renderGeoMap(){
  const preview=document.getElementById("geo-map-preview");
  const coordsText=document.getElementById("geo-coords-text");
  if(!preview)return;
  if(!state.formGeo.lat){ preview.classList.add("empty"); preview.innerHTML=`<span>แผนที่แสดงพื้นที่รัศมีจะปรากฏที่นี่หลังปักหมุด</span>`; if(coordsText){coordsText.textContent="ยังไม่ได้ปักหมุด"; coordsText.classList.remove("set");} return; }
  preview.classList.remove("empty");
  const radius=state.formGeo.radius, pxPerMeter=0.55, r=radius*pxPerMeter, cx=150, cy=90;
  const scaleMeters=radius<=50?20:radius<=100?50:100, scalePx=scaleMeters*pxPerMeter;
  const seed=Math.abs(Math.round((state.formGeo.lat+state.formGeo.lng)*10000))%1000;
  function rand(i){ return ((seed*(i+7))%97)/97; }
  let buildings="";
  const blockCols=[0,55,115,185,245,300], blockRows=[0,45,95,140,180];
  let bi=0;
  for(let row=0;row<blockRows.length-1;row++)for(let col=0;col<blockCols.length-1;col++){bi++; if(rand(bi)<0.25)continue; const bx=blockCols[col]+4, by=blockRows[row]+4, bw=(blockCols[col+1]-blockCols[col])-8, bh=(blockRows[row+1]-blockRows[row])-8, shade=rand(bi+50)<0.5?"#c9d2dd":"#d6dee7"; buildings+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="2" fill="${shade}"/>`; }
  preview.innerHTML=`<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="180" fill="#e8ecf1"/><g>${buildings}</g><path d="M0 45 H300 M0 95 H300 M0 140 H300" stroke="#fff" stroke-width="5"/><path d="M55 0 V180 M115 0 V180 M185 0 V180 M245 0 V180" stroke="#fff" stroke-width="5"/><path d="M0 45 H300 M0 95 H300 M0 140 H300" stroke="#b9c3cf" stroke-width="1"/><path d="M55 0 V180 M115 0 V180 M185 0 V180 M245 0 V180" stroke="#b9c3cf" stroke-width="1"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(24,95,165,0.16)" stroke="var(--navy-700)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="5" fill="var(--navy-700)"/><circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="var(--navy-700)" stroke-width="1.5" opacity="0.5"/><text x="${cx}" y="${cy-r-8<12?cy+r+16:cy-r-8}" text-anchor="middle" font-size="10" fill="var(--navy-700)" font-weight="600">รัศมี ${radius} ม.</text><g transform="translate(12,158)"><line x1="0" y1="0" x2="${scalePx}" y2="0" stroke="#4a5568" stroke-width="1.5"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#4a5568" stroke-width="1.5"/><line x1="${scalePx}" y1="-3" x2="${scalePx}" y2="3" stroke="#4a5568" stroke-width="1.5"/><text x="${scalePx/2}" y="14" text-anchor="middle" font-size="9" fill="#4a5568">${scaleMeters} ม.</text></g><g transform="translate(278,20)"><circle r="12" fill="#fff" stroke="#b9c3cf" stroke-width="1"/><path d="M0 -8 L3 3 L0 0 L-3 3 Z" fill="#B3432E"/><text y="20" text-anchor="middle" font-size="8" fill="#6b7684">N</text></g></svg>`;
  if(coordsText){ coordsText.textContent=`${state.formGeo.lat.toFixed(5)}, ${state.formGeo.lng.toFixed(5)}`; coordsText.classList.add("set"); }
  document.querySelectorAll(".radius-pill").forEach(p=>p.classList.toggle("active",Number(p.dataset.radius)===state.formGeo.radius));
}

function fileToDataUrl(file){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); }); }

function attachFormHandlers(existing){
  renderTeamList(); renderImgPreviews(); renderGeoMap();
  document.getElementById("f-require-checkout").addEventListener("click",(e)=>e.currentTarget.classList.toggle("on"));
  document.getElementById("geo-locate-btn").addEventListener("click",()=>{
    const btn=document.getElementById("geo-locate-btn");
    if(!navigator.geolocation){alert("อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง"); return;}
    btn.style.opacity="0.6"; btn.textContent="กำลังค้นหา…";
    navigator.geolocation.getCurrentPosition((pos)=>{
      state.formGeo.lat=pos.coords.latitude; state.formGeo.lng=pos.coords.longitude;
      btn.style.opacity="1"; btn.textContent="📍 ใช้ตำแหน่งปัจจุบัน"; renderGeoMap();
    },(err)=>{ btn.style.opacity="1"; btn.textContent="📍 ใช้ตำแหน่งปัจจุบัน"; alert("ไม่สามารถระบุตำแหน่งได้ กรุณาอนุญาตการเข้าถึงตำแหน่ง"); },{enableHighAccuracy:true, timeout:10000});
  });
  document.querySelectorAll(".radius-pill").forEach(p=>p.addEventListener("click",()=>{ state.formGeo.radius=Number(p.dataset.radius); renderGeoMap(); }));
  document.getElementById("close-modal").addEventListener("click",closeForm);
  document.getElementById("cancel-form-btn").addEventListener("click",closeForm);
  document.getElementById("form-overlay").addEventListener("click",(e)=>{ if(e.target.id==="form-overlay") closeForm(); });
  const teamInput=document.getElementById("team-input");
  const addTeam=()=>{ const val=teamInput.value.trim(); if(val){state.formTeam.push(val); teamInput.value=""; renderTeamList();} };
  document.getElementById("add-team-btn").addEventListener("click",addTeam);
  teamInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){e.preventDefault(); addTeam();} });
  const imgZone=document.getElementById("img-upload-zone"), imgInput=document.getElementById("img-input");
  imgZone.addEventListener("click",()=>imgInput.click());
  imgZone.addEventListener("dragover",(e)=>{e.preventDefault(); imgZone.style.borderColor="var(--navy-700)";});
  imgZone.addEventListener("dragleave",()=>{imgZone.style.borderColor="var(--line)";});
  imgZone.addEventListener("drop",async(e)=>{e.preventDefault(); imgZone.style.borderColor="var(--line)"; await handleFiles(e.dataTransfer.files);});
  imgInput.addEventListener("change",async(e)=>{await handleFiles(e.target.files); imgInput.value="";});
  async function handleFiles(fileList){
    const files=Array.from(fileList).filter(f=>f.type.startsWith("image/"));
    for(const f of files){ try{ const dataUrl=await fileToDataUrl(f); state.formImages.push(dataUrl); }catch(err){} }
    renderImgPreviews();
  }
  document.getElementById("save-form-btn").addEventListener("click",async()=>{
    const title=document.getElementById("f-title").value.trim();
    const type=document.getElementById("f-type").value;
    const errBox=document.getElementById("form-error");
    if(!title){errBox.textContent="กรุณากรอกชื่อกิจกรรม"; errBox.style.display="block"; return;}
    if(!type){errBox.textContent="กรุณาเลือกประเภทกิจกรรม"; errBox.style.display="block"; return;}
    const data={ id:state.editingId||uid(), title, type, academicYear:document.getElementById("f-year").value, semester:document.getElementById("f-semester").value, faculty:document.getElementById("f-faculty").value, date:document.getElementById("f-date").value, startTime:document.getElementById("f-start-time").value, endTime:document.getElementById("f-end-time").value, host:document.getElementById("f-host").value.trim(), description:document.getElementById("f-desc").value.trim(), team:[...state.formTeam], images:[...state.formImages], requireCheckout:document.getElementById("f-require-checkout").classList.contains("on"), minAttendPercent:Number(document.getElementById("f-min-attend-percent").value)||state.formDefaults.minAttendPercent, kpiAttendTarget:document.getElementById("f-attend-target").value, kpiAttendActual:document.getElementById("f-attend-actual").value, kpiSatTarget:document.getElementById("f-sat-target").value, kpiSatActual:document.getElementById("f-sat-actual").value, geoLat:state.formGeo.lat, geoLng:state.formGeo.lng, geoRadius:state.formGeo.radius, createdBy:existing?existing.createdBy:state.currentUser, updatedBy:state.currentUser, updatedAt:new Date().toISOString() };
    if(state.editingId){ const idx=state.events.findIndex(ev=>ev.id===state.editingId); state.events[idx]=data; }
    else{ state.events.push(data); }
    await saveEvents(); closeForm(); render();
  });
}

function closeForm(){ document.getElementById("modal-root").innerHTML=""; state.editingId=null; state.formImages=[]; state.formTeam=[]; state.formGeo={lat:null,lng:null,radius:100}; }

function enforceSession(){
  let session=null;
  try{ session=JSON.parse(localStorage.getItem("ubu_session")); }catch(e){}
  if(!session){ window.location.href="index.html"; return false; }
  if(session.role!=="organizer"){ const targets={admin:"Admin.html",participant:"Student.html"}; window.location.href=targets[session.role]||"index.html"; return false; }
  state.currentUser=session.name;
  const av=document.getElementById("navAvatar");
  if(av) av.textContent=initials(session.name);
  return true;
}

(async function init(){
  if(!enforceSession()) return;
  const sel=document.getElementById("filter-type");
  EVENT_TYPES.forEach(t=>sel.insertAdjacentHTML("beforeend",`<option value="${t}">${t}</option>`));
  await loadEvents(); render();
})();
</script>
